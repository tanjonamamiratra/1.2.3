name: Construire l'APK signé

on:
  workflow_dispatch:      # bouton « Run workflow » sur GitHub
  push:
    branches: [main]

permissions:
  contents: write         # pour enregistrer la clé de signature dans le dépôt PRIVÉ la première fois

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cherche le dossier qui contient settings.gradle.kts (à la racine ou dans un sous-dossier)
      - name: Trouver le dossier du projet
        run: |
          SETTINGS=$(find . -maxdepth 3 -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERREUR : settings.gradle.kts est introuvable. Le projet n'a pas été envoyé dans le dépôt."
            echo "Contenu du dépôt :"; ls -la; exit 1
          fi
          echo "Projet trouvé dans : $(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Créée UNE SEULE FOIS, puis réutilisée pour toutes les versions suivantes.
      # (Toutes les mises à jour doivent être signées avec la même clé.)
      - name: Créer la clé de signature si elle n'existe pas
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f signing/jkmm.jks ]; then
            mkdir -p signing
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore signing/jkmm.jks -alias jkmm \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=JKMM, O=Jesosy Kristy Mpanjakan'ny Mpanjaka, C=MG"
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=jkmm\n" "$PASS" "$PASS" > signing/keystore.properties
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -f signing
            git commit -m "Ajout de la clé de signature"
            git push
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Vérifier que la signature est bien configurée
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if ! grep -q "hasSigningKey" app/build.gradle.kts; then
            echo "ERREUR : le fichier app/build.gradle.kts du dépôt n'est pas la dernière version (il n'a pas la partie signature)."
            echo "Renvoyez le fichier app/build.gradle.kts du dernier JKMMBaiboly.zip dans le dossier app du dépôt."
            exit 1
          fi
          ls -la signing || true

      - name: Compiler l'APK signé
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleRelease --no-daemon

      - name: Nommer l'APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts || echo "inconnue")
          mkdir -p sortie
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERREUR : aucun APK n'a été créé. Fichiers trouvés dans app/build/outputs :"
            find app/build/outputs -maxdepth 4 | head -40
            exit 1
          fi
          echo "APK trouvé : $APK"
          case "$APK" in
            *unsigned*) echo "ATTENTION : cet APK n'est pas signé et ne s'installera pas."; exit 1 ;;
          esac
          cp "$APK" "sortie/Baiboly-JKMM-$VERSION.apk"
          # Affiche l'empreinte de la signature (pour vérifier que c'est toujours la même clé)
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          "$APKSIGNER" verify --print-certs "sortie/Baiboly-JKMM-$VERSION.apk" || true

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Baiboly-JKMM-apk
          path: ${{ env.PROJECT_DIR }}/sortie/*.apk

      - name: Sauvegarde de la clé (à télécharger et à garder en lieu sûr)
        uses: actions/upload-artifact@v4
        with:
          name: SAUVEGARDE-CLE-SECRETE
          path: ${{ env.PROJECT_DIR }}/signing/
